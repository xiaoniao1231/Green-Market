# 配置数据库的连接
spring:
  application:
    name: 青集市

  datasource:
    url: jdbc:mysql://localhost:3306/网页通信?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 0
      timeout: 3000ms

  # 文件上传限制：前端「发送文件」走 multipart（接口文档 3.2，上限 1GB）
  # 注意：经 nginx 访问时还受 nginx.conf 的 client_max_body_size 限制，如需更大文件请同步调大
  servlet:
    multipart:
      max-file-size: 1073741824
      max-request-size: 2147483648


#mybatis配置
mybatis:
  configuration:
    #日志输出
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    #驼峰映射
    map-underscore-to-camel-case: true
  #自定义存放路径
  mapper-locations: classpath:org/web03/mapper/*.xml



#spring事务管理日志
logging:
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug

# 阿里云OSS
aliyun:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    bucketName: java---web-ai
    region: cn-beijing
    # 访问凭证：默认从环境变量读取（不要把真实 AK/SK 提交到仓库）。
    # 也可在此直接填写，或在 IDEA 运行配置里以环境变量注入 —— 两者取其一即可；
    # 都缺失时上传接口会返回明确提示，而不是 SDK 的 "Access key id should not be null or empty."。
    accessKeyId: ${OSS_ACCESS_KEY_ID:}
    accessKeySecret: ${OSS_ACCESS_KEY_SECRET:}

# 在线状态：两个独立计时 —— 心跳只证明「页面还开着」（决定连接是否断开），
# 离开看的是用户操作 ACTIVE 帧（决定在线 / 离开），所以挂机时不会被判离线
app:
  presence:
    away-timeout-ms: 300000      # 离开：毫秒，默认 5 分钟（多久没有用户操作）
    heartbeat-timeout-ms: 90000  # 断开：毫秒，默认 90 秒（需大于前端心跳间隔 30 秒）
    sweep-interval-ms: 30000     # 状态巡检间隔（毫秒，默认 30 秒）：检测「在线 ↔ 离开」变化并广播

